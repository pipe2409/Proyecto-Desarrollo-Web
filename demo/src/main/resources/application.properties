spring.application.name=demo


# Base de datos H2
spring.datasource.url=jdbc:h2:file:./data/hoteldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
    
# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
# imprime los parametros de las querys
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# CONFIG SMTP (Gmail)
# Usa variables de entorno para NO commitear tu password real:
#   $env:MAIL_USERNAME = "tucorreo@gmail.com"
#   $env:MAIL_PASSWORD = "abcd efgh ijkl mnop"   (App Password de 16 chars)
# Si las variables no estan seteadas, se usan los valores por defecto
# (estan vacios para que el back arranque pero los emails NO se enviaran).
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL del front (para el link de verificacion en el email)
app.front.url=http://localhost:4200


# ============================================================
# STRIPE (modo TEST). Setea tu Secret Key como env var:
#   $env:STRIPE_SECRET_KEY = "sk_test_..."
# La obtienes en https://dashboard.stripe.com/test/apikeys
# Si no esta configurada, los endpoints de pago devolveran error 500.
# ============================================================
stripe.api.key=${STRIPE_SECRET_KEY:}


