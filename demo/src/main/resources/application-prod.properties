spring.application.name=demo

# ============================================================
# PUERTO (Render inyecta $PORT)
# ============================================================
server.port=${PORT:8080}

# ============================================================
# BASE DE DATOS - H2 EN MEMORIA (sin persistencia)
# Los datos se reinician en cada arranque. DataLoader vuelve a sembrarlos.
# ============================================================
spring.datasource.url=jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Logging mas silencioso en prod
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ============================================================
# CORS - origenes permitidos (URL de Vercel)
# Setear en Render: CORS_ORIGINS=https://tu-app.vercel.app
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ============================================================
# URL del front (links en correos de verificacion)
# Setear en Render: APP_FRONT_URL=https://tu-app.vercel.app
# ============================================================
app.front.url=${APP_FRONT_URL:http://localhost:4200}

# ============================================================
# SMTP (Gmail) - setear en Render
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
# STRIPE - setear en Render: STRIPE_SECRET_KEY=sk_test_...
# ============================================================
stripe.api.key=${STRIPE_SECRET_KEY:}

# ============================================================
# GEMINI - setear en Render: GEMINI_API_KEY=AIza...
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
